name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze 2>&1 | tee analyze-output.txt
        continue-on-error: true

      - name: Testes automatizados
        run: flutter test 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: finhealth-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Guardar saída da análise e dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analise-e-testes
          path: |
            analyze-output.txt
            test-output.txt
